name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: pytest -q

  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install implementation
        run: python -m pip install -e .
      - name: Exhaustive Python/spec conformance
        run: python tools/verify_fsm_exhaustive.py
      - name: Bridge protocol finite conformance
        run: python tools/verify_bridge_protocol_exhaustive.py
      - name: Bridge Schema / implementation drift
        run: python tools/verify_bridge_schema_contract.py
      - name: Audit broker side-effect call surface
        run: python tools/audit_side_effect_calls.py
      - name: Verify standalone QMT deployment files
        run: python tools/build_qmt_deployments.py --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch pinned TLA+ model checker
        shell: bash
        run: |
          mkdir -p .formal-tools
          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o .formal-tools/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  .formal-tools/tla2tools.jar" \
            | sha256sum -c -
      - name: TLC - finite order state machine
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config OrderFSM.cfg OrderFSM.tla
      - name: TLC - submit/recovery protocol
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config SubmitProtocol.cfg SubmitProtocol.tla
      - name: TLC - OMS leader lease
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config LeaderLease.cfg LeaderLease.tla
      - name: TLC - broker evidence replay
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config EvidenceReplay.cfg EvidenceReplay.tla
      - name: TLC - pre-submit restart recovery
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config PreSubmitRecovery.cfg PreSubmitRecovery.tla
      - name: TLC - risk precedence and fail-close
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config RiskPrecedence.cfg RiskPrecedence.tla
      - name: TLC - Bridge command protocol
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config BridgeCommandProtocol.cfg BridgeCommandProtocol.tla
      - name: TLC - Bridge event protocol
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config BridgeEventProtocol.cfg BridgeEventProtocol.tla
      - name: TLC - broker evidence boundary
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config BrokerEvidenceBoundary.cfg BrokerEvidenceBoundary.tla
