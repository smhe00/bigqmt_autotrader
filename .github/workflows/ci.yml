name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: pytest -q

  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install implementation
        run: python -m pip install -e .
      - name: Exhaustive Python/spec conformance
        run: python tools/verify_fsm_exhaustive.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch pinned TLA+ model checker
        shell: bash
        run: |
          mkdir -p .formal-tools
          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o .formal-tools/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  .formal-tools/tla2tools.jar" \
            | sha256sum -c -
      - name: TLC - finite order state machine
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config OrderFSM.cfg OrderFSM.tla
      - name: TLC - submit/recovery protocol
        run: |
          cd formal
          java -XX:+UseParallelGC -cp ../.formal-tools/tla2tools.jar tlc2.TLC -config SubmitProtocol.cfg SubmitProtocol.tla
