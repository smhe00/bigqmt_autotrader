[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bigqmt-autotrader"
version = "0.1.0.dev0"
description = "Fail-closed personal automated trading execution platform for Big QMT"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary / personal use until explicitly relicensed"}
authors = [{name = "bigqmt_autotrader contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "jsonschema>=4.23"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bigqmt_autotrader.oms.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
